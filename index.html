<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brandformance Score · Gupy Mídia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Arial&display=swap" rel="stylesheet">
<style>
:root {
  --gupy-navy:   #00122f;
  --gupy-blue:   #003cfd;
  --gupy-green:  #cdff82;
  --gupy-lilac:  #9e88ff;
  --gupy-orange: #ff5c1d;
  --white:       #ffffff;
  --bg:          #f4f6fb;
  --surface:     #ffffff;
  --surface2:    #f0f3fa;
  --border:      #e2e7f0;
  --border2:     #c8d0e0;
  --text:        #00122f;
  --text2:       #4a5568;
  --text3:       #8a96a8;
  --score-good:  #0a7c50;
  --score-warn:  #b36b00;
  --score-bad:   #c0392b;
  --score-good-bg: #e6f9f0;
  --score-warn-bg: #fff4e0;
  --score-bad-bg:  #fde8e8;
  --active-bg:   #e8ffd4;
  --active-c:    #2d6a00;
  --paused-bg:   #f0f0f0;
  --paused-c:    #8a96a8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* ── Header ── */
.header { background: var(--gupy-navy); padding: 0 40px; display: flex; align-items: center; justify-content: space-between; height: 60px; }
.logo { display: flex; align-items: center; gap: 14px; }
.logo svg { height: 28px; width: auto; }
.logo-divider { width: 1px; height: 22px; background: rgba(255,255,255,.2); }
.logo-label { font-size: 13px; font-weight: 700; color: var(--white); letter-spacing: .02em; }
.header-meta { font-size: 11px; color: rgba(255,255,255,.5); }
.header-meta span { color: var(--gupy-green); font-weight: 700; }

/* ── Nav ── */
.nav-bar { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 40px; display: flex; gap: 0; }
.nb { font-family: Arial, sans-serif; font-size: 13px; font-weight: 400; padding: 14px 20px; border: none; background: transparent; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; }
.nb:hover { color: var(--gupy-blue); }
.nb.on { color: var(--gupy-blue); border-bottom-color: var(--gupy-blue); font-weight: 700; }

/* ── Shell ── */
.shell { max-width: 1200px; margin: 0 auto; padding: 32px 40px 80px; }
.page { display: none; }
.page.on { display: block; animation: fadeUp .2s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* ── KPIs ── */
.kgrid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 20px; }
.kcard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; }
.kcard.highlight { border-color: var(--gupy-blue); border-left: 4px solid var(--gupy-blue); }
.klbl { font-size: 11px; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
.kval { font-size: 30px; font-weight: 700; line-height: 1; }
.ksub { font-size: 12px; margin-top: 6px; color: var(--text3); }
.go { color: var(--score-good); }
.wa { color: var(--score-warn); }
.ba { color: var(--score-bad); }
.up { color: var(--score-good); font-weight: 700; }
.dn { color: var(--score-bad); font-weight: 700; }
.meta-line { font-size: 11px; color: var(--text3); margin-top: 2px; }
.meta-line strong { color: var(--gupy-blue); }

/* ── Platform ── */
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.pcard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px; }
.plbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text3); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.pval { font-size: 40px; font-weight: 700; line-height: 1; }
.pmeta { font-size: 12px; color: var(--text3); margin-top: 5px; }
.prog { height: 4px; background: var(--surface2); border-radius: 2px; margin-top: 14px; overflow: hidden; }
.pf { height: 100%; border-radius: 2px; }

/* ── Cards ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 16px; }
.card:last-child { margin-bottom: 0; }
.slbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text3); margin-bottom: 18px; }
.leg { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 14px; }
.leg-i { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text2); }
.ll { width: 16px; height: 3px; border-radius: 2px; display: inline-block; }

/* ── Table ── */
.tbl-wrap { overflow-x: auto; }
.th { display: grid; gap: 10px; padding: 0 8px 10px; border-bottom: 2px solid var(--border); font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .07em; }
.tr { display: grid; gap: 10px; align-items: center; padding: 10px 8px; border-bottom: 1px solid var(--border); transition: background .1s; border-radius: 6px; }
.tr:last-child { border-bottom: none; }
.tr:hover { background: var(--surface2); }
.rname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; font-size: 13px; color: var(--text); }
.rmeta { font-size: 11px; color: var(--text3); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sbar { position: relative; height: 22px; background: var(--surface2); border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
.sbar-fill { height: 100%; border-radius: 4px; position: absolute; top: 0; left: 0; }
.sbar-lbl { position: relative; font-size: 12px; font-weight: 700; padding: 2px 8px; line-height: 18px; }
.nr { text-align: right; font-size: 12px; color: var(--text2); }
.medal { font-size: 14px; text-align: center; }

/* ── Badges ── */
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 700; }
.b-li   { background: #e6f0ff; color: #0a4fa8; }
.b-meta { background: #e8f0fe; color: #1a56c4; }
.b-active { background: var(--active-bg); color: var(--active-c); }
.b-paused { background: var(--paused-bg); color: var(--paused-c); }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.dot-on  { background: #22c55e; }
.dot-off { background: var(--text3); }

/* ── Filters ── */
.frow { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.fb { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; padding: 6px 16px; border-radius: 99px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text2); cursor: pointer; transition: all .15s; }
.fb:hover { border-color: var(--gupy-blue); color: var(--gupy-blue); }
.fb.on { background: var(--gupy-blue); border-color: var(--gupy-blue); color: var(--white); }

/* ── Creative grid ── */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill,minmax(160px,1fr)); gap: 14px; }
.cc { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; transition: all .15s; }
.cc:hover { border-color: var(--gupy-blue); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,60,253,.1); }
.ct { width: 100%; aspect-ratio: 1; background: var(--surface2); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.ct img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ct-ico { color: var(--border2); }
.cbdg { position: absolute; bottom: 6px; right: 6px; background: rgba(0,18,47,.7); color: #fff; font-size: 9px; font-weight: 700; border-radius: 4px; padding: 2px 6px; }
.cc-body { padding: 10px 12px; }
.cc-name { font-size: 11px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
.cc-init { font-size: 10px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 6px; }
.cc-row { display: flex; justify-content: space-between; align-items: center; }
.cc-score { font-size: 15px; font-weight: 700; }
.cc-sub { font-size: 10px; color: var(--text3); margin-top: 4px; }
.score-pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.sp-go { background: var(--score-good-bg); color: var(--score-good); }
.sp-wa { background: var(--score-warn-bg); color: var(--score-warn); }
.sp-ba { background: var(--score-bad-bg); color: var(--score-bad); }

/* ── Loader ── */
#loading { display: flex; align-items: center; justify-content: center; min-height: 50vh; flex-direction: column; gap: 16px; }
.spin { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--gupy-blue); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 900px) {
  .shell { padding: 20px 20px 60px; }
  .header, .nav-bar { padding-left: 20px; padding-right: 20px; }
  .kgrid { grid-template-columns: repeat(2,1fr); }
  .pgrid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <!-- Gupy wordmark SVG -->
    <svg viewBox="0 0 80 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Gupy">
      <text x="0" y="22" font-family="Arial" font-weight="700" font-size="22" fill="#ffffff">gupy</text>
    </svg>
    <div class="logo-divider"></div>
    <div class="logo-label">Brandformance Score</div>
  </div>
  <div class="header-meta">D-1 · atualizado em <span id="ts-date">—</span></div>
</div>

<div class="nav-bar">
  <button class="nb on" onclick="go('ov')">Visão Geral</button>
  <button class="nb"    onclick="go('in')">Iniciativas</button>
  <button class="nb"    onclick="go('cr')">Criativos</button>
</div>

<div class="shell">
  <div id="loading"><div class="spin"></div><span style="font-size:13px;color:var(--text3)">Carregando dados...</span></div>
  <div id="app" style="display:none">
    <div id="pov" class="page on"></div>
    <div id="pin" class="page"></div>
    <div id="pcr" class="page"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const DRIVE_FOLDER = '1eM0Mp7EwdTrpyba0N3-ivX7gpcbY_9hX';
let D = null, charts = {};

async function init() {
  try {
    const r = await fetch('data.json?v=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
    document.getElementById('ts-date').textContent =
      D.generated_at ? new Date(D.generated_at).toLocaleDateString('pt-BR') : '—';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderOv();
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<div style="color:#c0392b;font-size:13px">Erro ao carregar: ${e.message}</div>`;
  }
}

function go(p) {
  document.querySelectorAll('.nb').forEach((b,i) => b.classList.toggle('on', ['ov','in','cr'][i]===p));
  document.querySelectorAll('.page').forEach(el => el.classList.toggle('on', el.id==='p'+p));
  if (p==='in') renderIn();
  if (p==='cr') renderCr();
}

function sc(s)   { return s>=80?'var(--score-good)':s>=60?'var(--score-warn)':'var(--score-bad)'; }
function scBg(s) { return s>=80?'var(--score-good-bg)':s>=60?'var(--score-warn-bg)':'var(--score-bad-bg)'; }
function scC(s)  { return s>=80?'go':s>=60?'wa':'ba'; }
function spC(s)  { return s>=80?'sp-go':s>=60?'sp-wa':'sp-ba'; }
function fmt(n)  { if(n>=1e6) return (n/1e6).toFixed(1)+'M'; if(n>=1e3) return Math.round(n/1e3)+'k'; return Math.round(n); }
function activeBadge(a) {
  return a
    ? `<span class="badge b-active"><span class="dot dot-on"></span>Ativa</span>`
    : `<span class="badge b-paused"><span class="dot dot-off"></span>Pausada</span>`;
}
function platBadge(p) {
  return `<span class="badge ${p==='Linkedin'?'b-li':'b-meta'}">${p}</span>`;
}

function renderOv() {
  if (charts.evol) { charts.evol.destroy(); charts.evol=null; }
  if (charts.init) { charts.init.destroy(); charts.init=null; }
  const k=D.kpis, delta=+(k.sMes-k.sPrev).toFixed(1);

  document.getElementById('pov').innerHTML = `
<div class="kgrid">
  <div class="kcard highlight">
    <div class="klbl">Score mês · ${k.mesLabel}</div>
    <div class="kval ${scC(k.sMes)}">${k.sMes.toFixed(1)}</div>
    <div class="ksub ${delta>=0?'up':'dn'}">${delta>=0?'▲':'▼'} ${Math.abs(delta).toFixed(1)} pts vs ${k.prevLabel}</div>
    <div class="meta-line">Meta: <strong>80</strong></div>
  </div>
  <div class="kcard">
    <div class="klbl">Score Q2/26</div>
    <div class="kval ${scC(k.sQ2)}">${k.sQ2.toFixed(1)}</div>
    <div class="meta-line">Meta: <strong>80</strong></div>
  </div>
  <div class="kcard">
    <div class="klbl">Score 2026</div>
    <div class="kval ${scC(k.sYear)}">${k.sYear.toFixed(1)}</div>
    <div class="meta-line">Meta: <strong>80</strong></div>
  </div>
  <div class="kcard">
    <div class="klbl">Invest. mês · ${k.mesLabel}</div>
    <div class="kval" style="font-size:24px">R$${fmt(k.investMes)}</div>
    <div class="ksub">${fmt(k.impMes)} impressões</div>
  </div>
</div>
<div class="pgrid">
  ${['Linkedin','Meta'].map(p=>{
    const s=D.plat[p]; const has=s>0;
    const color = has ? sc(s) : 'var(--text3)';
    return `<div class="pcard">
      <div class="plbl">${platBadge(p)}</div>
      <div class="pval" style="color:${color}">${has?s.toFixed(1):'—'}</div>
      <div class="pmeta">Score ponderado · ${k.mesLabel}</div>
      <div class="prog"><div class="pf" style="width:${has?Math.min(s,100):0}%;background:${has?sc(s):'transparent'}"></div></div>
    </div>`;
  }).join('')}
</div>
<div class="card">
  <div class="slbl">Evolução mensal do score</div>
  <div class="leg">
    <div class="leg-i"><div class="ll" style="background:#8a96a8"></div>Total</div>
    <div class="leg-i"><div class="ll" style="background:#003cfd"></div>LinkedIn</div>
    <div class="leg-i"><div class="ll" style="background:#0a7c50"></div>Meta</div>
    <div class="leg-i"><div class="ll" style="background:#ff5c1d;opacity:.6"></div>Meta: 80</div>
  </div>
  <div style="position:relative;width:100%;height:220px">
    <canvas id="cEvol"></canvas>
  </div>
</div>
<div class="card">
  <div class="slbl">Top 5 iniciativas</div>
  <div style="position:relative;width:100%;height:${5*46+50}px">
    <canvas id="cInit"></canvas>
  </div>
</div>`;

  charts.evol = new Chart(document.getElementById('cEvol').getContext('2d'),{
    type:'line',
    data:{labels:D.monthly.map(m=>m.mes),datasets:[
      {label:'Total',   data:D.monthly.map(m=>m.total),   borderColor:'#8a96a8',borderWidth:2,pointRadius:3,tension:.35,fill:false},
      {label:'LinkedIn',data:D.monthly.map(m=>m.Linkedin),borderColor:'#003cfd',borderWidth:2,pointRadius:3,tension:.35,fill:false},
      {label:'Meta',    data:D.monthly.map(m=>m.Meta),    borderColor:'#0a7c50',borderWidth:2,pointRadius:3,tension:.35,fill:false,spanGaps:false},
      {label:'Meta 80', data:D.monthly.map(()=>80),       borderColor:'rgba(255,92,29,.5)',borderWidth:1.5,borderDash:[5,4],pointRadius:0,fill:false}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label==='Meta 80'?null:c.dataset.label+': '+c.parsed.y}}},
      scales:{x:{grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#8a96a8',font:{size:10,family:'Arial'},autoSkip:false,maxRotation:0}},
        y:{min:0,max:105,grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#8a96a8',font:{size:10,family:'Arial'}}}}}
  });

  const t5=D.inits.slice(0,5);
  charts.init = new Chart(document.getElementById('cInit').getContext('2d'),{
    type:'bar',
    data:{labels:t5.map(i=>i.nome.length>36?i.nome.slice(0,34)+'…':i.nome),
      datasets:[{label:'Score',data:t5.map(i=>i.score),
        backgroundColor:t5.map(i=>scBg(i.score)),
        borderColor:t5.map(i=>sc(i.score)),borderWidth:1.5,borderRadius:5}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'Score: '+c.parsed.x.toFixed(1)}}},
      scales:{x:{min:0,max:105,grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#8a96a8',font:{size:10,family:'Arial'}}},
        y:{grid:{display:false},ticks:{color:'#00122f',font:{size:11,family:'Arial',weight:'bold'}}}}}
  });
}

function renderIn() {
  const months4=D.months.slice(-4);
  const medals=['🥇','🥈','🥉'];
  const cols = `28px minmax(0,1fr) 90px 70px 54px ${months4.map(()=>'46px').join(' ')}`;
  let html=`<div class="card"><div class="slbl">Todas as iniciativas · score ponderado por investimento</div>
  <div class="tbl-wrap">
  <div class="th" style="grid-template-columns:${cols}">
    <div></div><div>Iniciativa</div><div style="text-align:right">Score</div>
    <div style="text-align:right">Invest.</div><div style="text-align:right">Share</div>
    ${months4.map(m=>`<div style="text-align:right">${m}</div>`).join('')}
  </div>`;
  D.inits.forEach((it,i)=>{
    const last4=it.monthly.slice(-4);
    html+=`<div class="tr" style="grid-template-columns:${cols}">
      <div class="medal">${i<3?medals[i]:(i+1)}</div>
      <div>
        <div class="rname">${it.nome}</div>
        <div class="rmeta">
          ${platBadge(it.plat)}
          ${activeBadge(it.active)}
          <span>${fmt(it.impressoes)} imp</span>
          <span>eng ${it.engajamento.toFixed(1)}%</span>
        </div>
      </div>
      <div><div class="sbar">
        <div class="sbar-fill" style="width:${Math.min(it.score,100)}%;background:${scBg(it.score)}"></div>
        <div class="sbar-lbl" style="color:${sc(it.score)}">${it.score.toFixed(1)}</div>
      </div></div>
      <div class="nr">R$${fmt(it.investimento)}</div>
      <div class="nr">${it.share}%</div>
      ${last4.map(m=>`<div class="nr" style="color:${m.score!=null?sc(m.score):'var(--text3)'}">${m.score!=null?m.score.toFixed(0):'—'}</div>`).join('')}
    </div>`;
  });
  html+='</div></div>';
  document.getElementById('pin').innerHTML=html;
}

let activeF='all';
function renderCr() {
  document.getElementById('pcr').innerHTML=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px">
      <div class="slbl" style="margin-bottom:0">${D.creatives.length} criativos rankeados</div>
      <div class="frow" style="margin-bottom:0" id="frow">
        <button class="fb on" data-f="all">Todos</button>
        <button class="fb" data-f="active">Ativos</button>
        <button class="fb" data-f="Linkedin">LinkedIn</button>
        <button class="fb" data-f="Meta">Meta</button>
        <button class="fb" data-f="video">Vídeo</button>
        <button class="fb" data-f="img">Estático</button>
      </div>
    </div>
    <div class="cgrid" id="cgrid"></div>
  </div>`;
  buildCr();
  document.querySelectorAll('#frow .fb').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('#frow .fb').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); activeF=b.dataset.f; buildCr();
    };
  });
}

function buildCr() {
  const list=D.creatives.filter(c=>{
    if(activeF==='all')    return true;
    if(activeF==='active') return c.active;
    if(activeF==='video')  return c.video;
    if(activeF==='img')    return !c.video;
    return c.plat===activeF;
  });
  const g=document.getElementById('cgrid'); g.innerHTML='';
  list.forEach(c=>{
    const card=document.createElement('div'); card.className='cc';
    const ext=(c.drive_file?(c.drive_file.split('.').pop()||''):'').toUpperCase()||'?';
    card.innerHTML=`<div class="ct">
      <svg class="ct-ico" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        ${c.video?'<polygon points="5 3 19 12 5 21 5 3"/>':'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>'}
      </svg>
      <div class="cbdg">${ext}${c.code?' #'+c.code:''}</div>
    </div>
    <div class="cc-body">
      <div class="cc-name">${c.name||c.code||'Criativo'}</div>
      <div class="cc-init">${c.nome}</div>
      <div class="cc-row">
        <span class="score-pill ${spC(c.score)}">${c.score.toFixed(0)}/100</span>
        <div style="display:flex;gap:4px;align-items:center">
          ${platBadge(c.plat)}
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
        <div class="cc-sub">R$${fmt(c.investimento)} · ${fmt(c.impressoes)} imp</div>
        ${activeBadge(c.active)}
      </div>
    </div>`;
    card.title=c.ad;
    g.appendChild(card);
  });
}

init();
</script>
</body>
</html>
