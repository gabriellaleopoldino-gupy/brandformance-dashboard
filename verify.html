<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificando acesso...</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0a0b; --surface:#111114; --border2:rgba(255,255,255,.12); --text:#f0f0ef; --muted:#6b6b72; --green:#2dcc8f; --red:#e8503a; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
.card { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; padding: 48px 40px; width:100%; max-width:360px; text-align:center; }
.spinner { width:36px; height:36px; border:2px solid rgba(255,255,255,.08); border-top-color:var(--green); border-radius:50%; margin:0 auto 24px; animation:spin .6s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
h2 { font-family:'Syne',sans-serif; font-size:17px; margin-bottom:8px; }
p  { font-size:12px; color:var(--muted); }
a  { color:var(--green); text-decoration:none; }
.icon { font-size:32px; margin-bottom:16px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner"></div>
  <h2>verificando acesso</h2>
  <p>aguarde um momento...</p>
</div>
<script>
(async function(){
  var params = new URLSearchParams(window.location.search);
  var token  = params.get('token');
  var card   = document.getElementById('card');

  if (!token) { err('link inválido — nenhum token encontrado.'); return; }

  try {
    var res  = await fetch('/api/verify-token?token=' + token);
    var data = await res.json();
    if (res.ok && data.ok) {
      localStorage.setItem('bf_session', JSON.stringify({ email: data.email, exp: data.exp }));
      window.location.replace('/');
    } else {
      err(data.error || 'token inválido ou expirado.');
    }
  } catch(e) { err('erro de conexão. tente novamente.'); }

  function err(msg) {
    card.innerHTML = '<div class="icon">⚠</div><h2>acesso negado</h2><p style="margin:8px 0 20px">' + msg + '</p><a href="/login.html">← solicitar novo link</a>';
  }
})();
</script>
</body>
</html>
